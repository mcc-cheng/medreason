services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: drug_canvas
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: canvas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas -d drug_canvas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
