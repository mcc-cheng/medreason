[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veridicus"
version = "0.1.0"
description = "Institutional reasoning memory layer for healthcare AI agents"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.39.0",
    "click>=8.1.7",
    "pydantic>=2.5.0",
    "psycopg2-binary>=2.9.9",
    "numpy>=1.26.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
pgvector = ["pgvector>=0.2.4"]
openai = ["openai>=1.12.0"]
dev = ["pytest>=7.4.0", "ruff>=0.1.0"]

[project.scripts]
veridicus = "medreason.__main__:cli"

[tool.setuptools.packages.find]
include = ["medreason*"]
